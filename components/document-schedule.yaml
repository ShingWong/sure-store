name: document-schedule
description: Dated installments and their late figures — the coupon arithmetic, displayed not invented.
tier: prototype
parameters:
  fields:
    - name: installments
      type: text
      required: true
behavior:
  notificationModes: []
  audio: { errorBell: false, successChime: false }
  voiceHelp: false
  autoFocus: false
  confirmBeforeCancel: false

# ── sure-factor 0.6 document-part extension ─────────────────────────────────
family: data
data:
  entity: examples
  projection: [installment, due_on, amount, late_fee]
  shape: rows
print:
  keepTogether: true
  breakBefore: false
  repeatHeader: true
guards:
  - totals.grand_total == sum(rows.amount) + sum(rows.late_fee)
  - count(rows.installment) >= 1
fixture:
  input:
    synthetic: true
    seed: 20261119
    generatedAt: '2026-11-19'
    shape: rows
    rows:
      - installment: 1
        due_on: '2031-06-15'
        amount: 100.00
        late_fee: 5.00
      - installment: 2
        due_on: '2031-07-15'
        amount: 100.00
        late_fee: 5.00
    totals: { grand_total: 210.00 }
  expect:
    html_contains: ['$100.00', '$5.00', '$210.00', '2031-06-15']
    pages: 1
    row_count: 2
    guards_pass: true
# ────────────────────────────────────────────────────────────────────────────

sure_ui: [table, form, buttons]
cssClasses:
  form: sure-form
  table: sure-table
  row: sure-table__row
  cell: sure-table__cell
  header: sure-table__header
example:
  usage: Show two synthetic installments with a late fee and the server's reconciled total.
