<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>document-graphic — sure-store document part</title>
<style>@layer sure.tokens, sure.components, sure.mobile;

@layer sure.tokens {
:root {
  /* Typography contract (all sure-ui themes declare these). */
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --font-size: 100%;
  --line-height: 1.6;
  /* Document typography stacks — print metrics live in SURE_TYPOGRAPHY (TS). */
  --sure-font-h1: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sure-font-h2: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sure-font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sure-font-caption: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sure-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  /* Native controls (date pickers, scrollbars) follow the theme. */
  color-scheme: light;
  --nord0: #2e3440;
  --nord1: #3b4252;
  --nord2: #434c5e;
  --nord3: #4c566a;
  --nord4: #767f94;
  --nord5: #e5e9f0;
  --nord6: #eceff4;
  --nord7: #8fbcbb;
  --nord8: #88c0d0;
  --nord9: #81a1c1;
  --nord10: #5e81ac;
  --nord11: #bf616a;
  --nord12: #d08770;
  --nord13: #ebcb8b;
  --nord14: #a3be8c;
  --nord15: #b48ead;

  /* Generic aliases: the same names in every theme, so an app can style
     itself with var(--bg) and still follow whichever theme is active. */
  --bg: var(--nord6);
  --surface: var(--nord6);
  --text: var(--nord0);
  --muted: var(--nord3);
  --border: var(--nord4);
  --accent: #415e9c;
  --error: var(--nord11);
  --success: var(--nord14);
  --highlight: var(--nord5);
  --warn: var(--nord13);

  /* Status inks: text that reads on a 10% tint of its status colour (alerts,
     badges). The status hues are mid-tone, so as text they land at 1.7–3.2:1
     on a near-white page. Each ink is its hue darkened until it clears 4.5:1,
     verified in index.test.ts. */
  --error-ink: #86444a;
  --success-ink: #525f46;
  --accent-ink: #4d6174;
  --warn-ink: #6a5b3f;
  --on-accent: #fff;
  --primary: var(--nord9);
  --primary-hover: var(--nord8);
  --primary-ink: var(--nord0);
  --toast-bg: var(--nord0);
  --toast-ink: var(--nord6);
  --on-error: #fff;
  --on-success: var(--text);
  --table-header: var(--nord5);
  --table-header-ink: var(--nord0);
  --table-hover: var(--nord6);
  --field: #fff;
  --focus: var(--nord9);
  --sidepanel-bg: #fff;
  --sidepanel-ink: var(--nord0);
  --status-bg: var(--nord0);
  --status-ink: var(--nord6);
}
}

@layer sure.components {


*, *::before, *::after { box-sizing: border-box; }
  .btn-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    height: 1.75rem;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: transparent;
    color: inherit;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
  }
  .btn-icon:hover { background: var(--highlight); }
  .btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Buttons ── */
.btn-primary {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 1.25rem; border: none; border-radius: 6px;
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
  color: var(--primary-ink); background: var(--primary);
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 1.25rem; border: 1px solid var(--border); border-radius: 6px;
  font-size: 0.9rem; font-weight: 500; cursor: pointer;
  color: var(--text); background: transparent;
  transition: background 0.15s;
}
.btn-secondary:hover { background: var(--highlight); }
  

/* Typography consumption — the theme decides the stack and scale; these
   rules are what actually apply them. Kept identical in every theme so a
   runtime swap never drops the base typography. */
html { font-size: var(--font-size, 100%); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: var(--line-height, 1.6);
}
code, pre { font-family: var(--font-mono); }

/* ── Document ──
   Printable sheets for sure-document. The same markup is the screen preview
   and the artefact: on screen a sheet is drawn as the declared paper (size,
   margins as padding, a gap and a shadow at each break); in print those
   pretences drop away and @page owns size and margins (design §11). Furniture
   is sheet-level, so a fixed form and a flowing statement carry the same head,
   foot, page number, date, signature, graphic and watermark.

   Every colour comes from the generic aliases, so one block serves all seven
   themes. Geometry is declared through these knobs (points unless noted), set
   by the renderer on the sheet; the defaults describe portrait letter:
     --sure-sheet-w / --sure-sheet-h  declared paper
     --sure-sheet-scale               preview scale; never reaches the paper
     --sure-sheet-margin              page margins, as screen padding
     --sure-sheet-gap                 space between sheets on screen
     --sure-watermark-angle/-opacity/-size
     --sure-graphic-max-height */
.sure-document {
  color: var(--text);
  font-family: var(--font-body);
  line-height: var(--line-height, 1.6);
}
.sure-document__sheet {
  --sure-sheet-w: 612pt;
  --sure-sheet-h: 792pt;
  --sure-sheet-scale: 1;
  --sure-sheet-margin: 36pt;
  --sure-sheet-gap: 2rem;
  --sure-watermark-angle: -45deg;
  --sure-watermark-opacity: 0.1;
  --sure-watermark-size: 3rem;
  --sure-graphic-max-height: 4rem;

  position: relative;
  box-sizing: border-box;
  width: calc(var(--sure-sheet-w) * var(--sure-sheet-scale));
  min-height: calc(var(--sure-sheet-h) * var(--sure-sheet-scale));
  margin: 0 auto var(--sure-sheet-gap);
  padding: var(--sure-sheet-margin);
  overflow: hidden;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  box-shadow: 0 2px 12px color-mix(in srgb, var(--text) 16%, var(--bg));
  /* page-break helper: one sheet per printed page, except the last */
  break-after: page;
  page-break-after: always;
}
.sure-document__sheet:last-child {
  margin-bottom: 0;
  break-after: auto;
  page-break-after: auto;
}
/* Three zones per running head/foot. Repetition is a renderer fact — one of
   each per sheet — so CSS only keeps the furniture with its sheet. */
.sure-document__header,
.sure-document__footer {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  align-items: baseline;
  gap: 0.5rem 1rem;
  color: var(--muted);
  font-size: 0.8125rem;
  break-inside: avoid;
  page-break-inside: avoid;
}
.sure-document__header { padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
.sure-document__footer { padding-top: 0.5rem; border-top: 1px solid var(--border); }
.sure-document__header--no-rule,
.sure-document__footer--no-rule { border: 0; }
.sure-document__zone { min-width: 0; }
.sure-document__zone--center { text-align: center; }
.sure-document__zone--right { text-align: right; }
.sure-document__page,
.sure-document__date {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
/* keep-together: a section that would cross a sheet is moved, never split */
.sure-document__section {
  margin: 0 0 1rem;
  break-inside: avoid;
  page-break-inside: avoid;
}
.sure-document__section--break-before {
  break-before: page;
  page-break-before: always;
}
.sure-document__signature {
  margin-top: 1.5rem; padding-top: 0.5rem;
  border-top: 1px solid var(--border);
  break-inside: avoid;
  page-break-inside: avoid;
}
.sure-document__graphic {
  max-height: var(--sure-graphic-max-height);
  break-inside: avoid;
  page-break-inside: avoid;
}
.sure-document__graphic svg,
.sure-document__graphic img {
  display: block; max-width: 100%; max-height: 100%; height: auto;
}
/* monochrome logo: currentColor, not a baked palette */
.sure-document__graphic--monochrome svg { color: var(--text); }
.sure-document__graphic--monochrome svg * { fill: currentColor; stroke: currentColor; }
/* watermark: behind the body, arbitrary angle, capped by the renderer's
   opacity input — never above the text it might obscure */
.sure-document__watermark {
  position: absolute; inset: 0; z-index: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  pointer-events: none;
  user-select: none;
  color: var(--muted);
  opacity: var(--sure-watermark-opacity);
  font-size: var(--sure-watermark-size);
  font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
}
.sure-document__watermark > * {
  transform: rotate(var(--sure-watermark-angle));
  white-space: nowrap;
}
.sure-document__sheet > .sure-document__header,
.sure-document__sheet > .sure-document__footer,
.sure-document__sheet > .sure-document__zone,
.sure-document__sheet > .sure-document__section,
.sure-document__sheet > .sure-document__signature,
.sure-document__sheet > .sure-document__graphic { position: relative; z-index: 1; }
.sure-document__watermark--print { display: none; }
@media print {
  /* @page owns size and margins; the host emits @page { size; margin } from
     the sheet declaration. No paper geometry is hardcoded here. */
  .sure-document__sheet {
    width: auto; min-height: 0;
    margin: 0; padding: 0;
    border: 0; box-shadow: none;
    overflow: visible;
  }
  .sure-document__watermark,
  .sure-document__graphic {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .sure-document__watermark--print { display: flex; }
  .sure-document__watermark--screen { display: none; }
  /* Unlike the site footer, sheet furniture is part of the paper. */
  .sure-document__header,
  .sure-document__footer { display: grid; }
  .sure-document__header--no-print,
  .sure-document__footer--no-print { display: none; }
}

/* ── Figure ──
   Inline SVG built by sure-document from data → scale → path. No canvas, no
   charting dependency, no animation. Series are token-coloured and carry a
   dash/pattern fallback so the figure survives grayscale and a photocopier
   (catalog §4 rule 2). The data-table fallback stays for screen readers; print
   hides it so chart and table do not print back-to-back, and a layout may opt
   back in with .sure-figure--show-data (catalog §4 rule 3). */
.sure-figure {
  margin: 1rem 0;
  color: var(--text);
  font-family: var(--font-body);
  break-inside: avoid;
  page-break-inside: avoid;
}
.sure-figure__plot {
  display: block; width: 100%; height: auto; max-width: 100%;
  overflow: visible;
}
.sure-figure__axis {
  stroke: var(--border); stroke-width: 1;
  color: var(--muted); font-size: 0.75rem;
}
.sure-figure__axis text { fill: var(--muted); stroke: none; }
.sure-figure__bar {
  fill: var(--accent); stroke: var(--text); stroke-width: 1;
}
.sure-figure__bar:nth-of-type(even),
.sure-figure__bar--alt {
  fill: var(--muted); stroke-dasharray: 3 2;
}
.sure-figure__line {
  fill: none; stroke: var(--text); stroke-width: 2;
}
.sure-figure__line--alt { stroke: var(--muted); stroke-dasharray: 6 3; }
.sure-figure__legend {
  display: flex; flex-wrap: wrap; gap: 0.25rem 1rem;
  margin: 0.5rem 0 0; padding: 0; list-style: none;
  color: var(--muted); font-size: 0.8rem;
}
.sure-figure__legend li { display: inline-flex; align-items: center; gap: 0.35rem; }
.sure-figure__legend li::before {
  content: '';
  width: 0.75rem; height: 0.75rem; flex-shrink: 0;
  background: var(--accent); border: 1px solid var(--border);
}
.sure-figure__legend li:nth-child(even)::before {
  background: var(--muted); border-style: dashed;
}
.sure-figure table {
  width: 100%; margin-top: 0.5rem;
  border-collapse: collapse; font-size: 0.8rem; color: var(--text);
}
.sure-figure table caption { color: var(--muted); text-align: left; }
.sure-figure table th,
.sure-figure table td {
  padding: 0.25rem 0.5rem;
  border-bottom: 1px solid var(--border); text-align: left;
}
@media print {
  /* chart and data table must not print back-to-back */
  .sure-figure table { display: none; }
  .sure-figure--show-data table { display: table; }
  .sure-figure__plot {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}
}

@layer sure.mobile {


/* ── Mobile & touch ─────────────────────────────────────────────── */
@media (max-width: 640px) {
  .sure-form, .sure-modal__form, .sure-auth__form { max-width: 100%; }
  .sure-auth__form { padding: 1.25rem; }
  .side-panel { width: min(320px, 100vw); }
  .sure-dialog-overlay { padding: 0.5rem; }
  .sure-dialog { max-width: calc(100vw - 1rem); }
  .toast { max-width: calc(100vw - 2rem); }
  .sure-form__actions, .sure-row-actions { flex-wrap: wrap; }
  .sure-table__cell, .sure-table__header { padding: 0.5rem 0.4rem; }
}

@media (hover: none) {
  .message .msg-actions { display: flex; }
  .sure-session-item .sure-session-actions { display: flex; }
}

@media (pointer: coarse) {
  .btn-primary, .btn-secondary, .btn-icon,
  .sure-auth__btn, .sure-auth__btn--social,
  .sure-nav__item, .sure-menu__item,
  .sure-session-item, .side-panel__item { min-height: 44px; }
  .btn-icon { width: 44px; height: 44px; }
  .sure-form input, .sure-form select, .sure-form textarea,
  .sure-modal__form input, .sure-modal__form select, .sure-modal__form textarea,
  .sure-auth__input, .sure-search__input,
  .sure-filters input, .sure-filters select { min-height: 44px; }
  .sure-dialog__resize--e, .sure-dialog__resize--w { width: 16px; }
  .sure-dialog__resize--n, .sure-dialog__resize--s { height: 16px; }
  .sure-dialog__resize--ne, .sure-dialog__resize--nw,
  .sure-dialog__resize--se, .sure-dialog__resize--sw { width: 24px; height: 24px; }
}

}
</style>
<style>body{margin:0;padding:2rem;background:#f4f4f4} .sure-document{margin:0 auto}</style>
</head>
<body>
<style>@page { size: 612pt 792pt; margin: 36pt 36pt 36pt 36pt; }</style>
<div class="sure-document">
<section class="sure-document__sheet" style="--sure-sheet-w:612pt;--sure-sheet-h:792pt;--sure-sheet-margin:36pt;--sure-sheet-gap:2rem;--sure-sheet-scale:1;font-family:var(--sure-font-body)"><div class="sure-figure sure-figure--show-data" style="position:absolute;left:36pt;top:36pt;width:360pt;height:240pt;z-index:1;"><svg class="sure-document__graphic sure-figure__plot" viewBox="0 0 360 240" role="img" aria-labelledby="document-graphic-title document-graphic-desc"><title id="document-graphic-title">Test illustration</title><desc id="document-graphic-desc">A synthetic mark.</desc><line class="sure-figure__axis" x1="30" y1="220" x2="350" y2="220"/><line class="sure-figure__axis" x1="30" y1="20" x2="30" y2="220"/></svg><ul class="sure-figure__legend"></ul><table><caption>Test illustration</caption><thead><tr><th>Category</th><th>Value</th></tr></thead><tbody></tbody></table></div></section>
</div>
</body>
</html>
