name: CI

# Two gates, in the order that fails fast:
#   1. the security gate — this repository becomes public once the contract is
#      stable, so a leak must never reach main: history is permanent, and an
#      entry removed today is still recoverable tomorrow;
#   2. contract verification — the dialect tables, the fixtures and the
#      reference renderer must still agree.
#
# The GATES install nothing: the repo has no runtime dependency and both gates
# run on a fresh clone under plain node. Packaging is separate and unavoidable —
# `exports` must point at compiled output, because a compiled consumer
# (sure-factor runs plain node >= 20) cannot load raw TypeScript. So the
# `package` job installs a build toolchain, and the gate job still proves the
# contract without one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: security + verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          # The security gate inspects commit author/committer identities across
          # the whole history. A shallow clone would silently skip them — which
          # is exactly how a personal address reaches a public repo.
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Security gate — no keys, credentials, PII, IPs, env paths
        run: npm run security:check

      - name: Gate tests — prove the scanner fires, and allows look-alikes
        run: npm test

      - name: Contracts and fixtures are valid JSON
        run: npm run check:contracts

      - name: Fixture format — envelope, case shape, every path resolves
        run: npm run check:fixtures

      - name: Contract verification — fixtures against the reference renderer
        run: npm run verify

  package:
    name: package builds and imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The only job that installs. TypeScript is a build tool, never a runtime
      # dependency, and no measured value depends on it.
      - name: Build toolchain
        run: npm ci

      - name: Compile
        run: npm run build

      - name: Packaging guard — the entry is compiled and importable
        run: node --test test/package.test.mjs

      - name: Tarball contains the contract beside the code
        run: npm pack --dry-run

  driver:
    name: node:sqlite driver — fixtures through the driver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # A driver necessarily depends on the package it drives, so this job links
      # the workspace and builds. The gate job above still proves the contract
      # with nothing installed — this is a consumer, and consumers build.
      - name: Workspace + compiler
        run: npm ci

      - name: Compile the contract and the driver
        run: npm run build

      - name: Fixtures must pass THROUGH the driver, not the built-in adapter
        run: npm test --workspace @shing.wong/sure-store-driver-node-sqlite

  behaviour:
    name: behavioural fixtures on all three engines
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sure_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The only behavioural run that installs: sqlite needs nothing, but Turso
      # and Postgres need real drivers, and a fixture suite that skips them is a
      # suite that has not been run.
      - name: Drivers
        run: npm ci

      - name: Fixtures, every engine — a missing driver is a FAILURE here
        run: npm run verify:behaviour:all
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: sure_store
